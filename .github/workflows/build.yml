name: Build, Test & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Spring Boot) — Build & Test
    runs-on: ubuntu-latest
    services:
      # @SpringBootTest loads the full context including Mongo auto-config,
      # so the tests need a real (even if empty) MongoDB to connect to.
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests
        working-directory: ./backend
        env:
          JWT_SECRET: ci-test-secret-key-not-for-production-use-only
          MONGODB_URI: mongodb://localhost:27017/truthshield_ci
          MAIL_USERNAME: ci@example.com
          MAIL_PASSWORD: ci-placeholder
        run: mvn -B clean verify

  ml-server:
    name: ML Server (Python) — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./ml-server
        run: pip install -r requirements.txt

      - name: Check the app imports and trains without errors
        working-directory: ./ml-server
        run: python -c "import truthShield_ml"

  frontend:
    name: Frontend (React) — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build

  # ---------------------------------------------------------------------
  # DEPLOY — only runs on a push to main, and only after backend, ml-server,
  # AND frontend have all built/tested successfully (see `needs:` below).
  # This is what makes it CI/CD rather than just CI: a failing test blocks
  # deployment instead of Render/Netlify deploying broken code independently.
  #
  # Setup required (one-time, in your GitHub repo → Settings → Secrets and
  # variables → Actions → New repository secret):
  #   RENDER_BACKEND_DEPLOY_HOOK   → Render dashboard → backend service →
  #                                   Settings → Deploy Hook → copy URL
  #   RENDER_ML_DEPLOY_HOOK        → same, for the ml-server service
  #   NETLIFY_BUILD_HOOK           → Netlify dashboard → Site settings →
  #                                   Build & deploy → Build hooks → Add
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy (Render + Netlify)
    runs-on: ubuntu-latest
    needs: [backend, ml-server, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render backend deploy
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK secret not set — skipping backend deploy trigger."
          fi

      - name: Trigger Render ML-service deploy
        run: |
          if [ -n "${{ secrets.RENDER_ML_DEPLOY_HOOK }}" ]; then
            curl -fsS -X POST "${{ secrets.RENDER_ML_DEPLOY_HOOK }}"
          else
            echo "RENDER_ML_DEPLOY_HOOK secret not set — skipping ML service deploy trigger."
          fi

      - name: Trigger Netlify frontend deploy
        run: |
          if [ -n "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            curl -fsS -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}"
          else
            echo "NETLIFY_BUILD_HOOK secret not set — skipping frontend deploy trigger."
          fi
