<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      background: #1a1a2e;
      color: white;
      font-family: Arial, sans-serif;
    }
    h2 { 
      color: #e94560; 
      text-align: center;
      margin-bottom: 12px;
    }
    textarea {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: white;
      resize: none;
      box-sizing: border-box;
      font-size: 13px;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }
    button:hover {
      background: #c73652;
    }
    #result {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
    }
    .fake { 
      background: rgba(233,69,96,0.2); 
      color: #e94560;
      border: 1px solid rgba(233,69,96,0.4);
    }
    .real { 
      background: rgba(0,184,148,0.2); 
      color: #00b894;
      border: 1px solid rgba(0,184,148,0.4);
    }
    .error {
      background: rgba(255,255,255,0.1);
      color: #aaa;
    }
  </style>
</head>
<body>
  <h2>🛡️ TruthShield</h2>
  <textarea id="inputText" rows="4"
    placeholder="Suspicious text paste pannunga..."></textarea>
  <button id="analyzeBtn">🔍 ANALYZE NOW</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
