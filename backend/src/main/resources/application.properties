server.port=8082

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=truthshield

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT — set JWT_SECRET as an environment variable (32+ random characters).
# NEVER commit a real secret value here.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Python ML microservice URL — defaults to localhost for local dev,
# override with the deployed ML service URL in production (Railway/Render).
ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:5000/detect}

# Allowed frontend origin for CORS — override per environment.
frontend.url=${FRONTEND_URL:https://truthshield-ai-fake-detection-system.netlify.app}
